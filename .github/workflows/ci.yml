name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  build-dlls:
    uses: ./.github/workflows/build-dlls.yml

  test:
    name: Unit Tests
    runs-on: windows-latest
    needs: build-dlls
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Configure Rust Logging
        shell: bash
        run: |
          if [ "${{ runner.debug }}" = "1" ]; then
            echo "RUST_LOG=debug" >> $GITHUB_ENV
          else
            echo "RUST_LOG=info" >> $GITHUB_ENV
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download tree-sitter DLLs
        uses: actions/download-artifact@v8
        with:
          name: tree-sitter-dlls
          path: bin

      - name: Setup ahkbuild
        uses: ./.github/actions/setup-ahkbuild

      - run: ahkbuild run build/barrel.ahk
      - run: ahkbuild run tests/RunTests.ahk

      - name: Publish Test Results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: tests/junit.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          check_name: Test Results (${{ matrix.exe }} - ${{ matrix.version }})
          require_passed_tests: true

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Fail if any matrix job failed
        if: needs.test.result != 'success'
        run: exit 1

  publish:
    needs: build-dlls
    uses: ./.github/workflows/build-exe.yml